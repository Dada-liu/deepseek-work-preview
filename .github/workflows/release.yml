name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Prepare embedded runtime (Node + DSH tree)
        shell: bash
        run: bash scripts/prepare-runtime.sh

      - name: Build app
        run: pnpm tauri build

      - name: Collect artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-artifact
          cp src-tauri/target/release/bundle/dmg/*.dmg release-artifact/

      - name: Collect artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release-artifact
          cp src-tauri/target/release/bundle/nsis/*.exe release-artifact/

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: DeepSeek Work ${{ steps.tag.outputs.tag }}
          body: |
            ## 安装提示

            **macOS**：应用未做 Apple 公证，下载的 dmg 安装后首次打开若提示「"DeepSeek Work"已损坏，无法打开」，在终端执行一次：

            ```bash
            xattr -cr /Applications/DeepSeek\ Work.app
            ```

            **Windows**：SmartScreen 提示时选「仍要运行」。若启动报「拒绝访问 (os error 5)」，请将安装目录或 `%APPDATA%\com.deepseek-harness.desktop` 加入杀毒软件白名单。
          generate_release_notes: true
          files: release-artifact/*
