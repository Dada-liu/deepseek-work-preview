[package]
name = "deepseek-work"
version = "0.1.9"
description = "DeepSeek Work desktop agent powered by Tauri v2"
authors = ["DeepSeek Work Team"]
edition = "2021"

[lib]
name = "deepseek_work_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
